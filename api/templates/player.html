<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player profile: {{ player }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('leaderboard') }}" class="links">TOP</a>
        <a href="{{ url_for('rules') }}" class="links">RULES</a>
    </nav>

    <header class="profile-header">
        <h1>Player Profile</h1>
        <h2>Name: {{ player }}</h2>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <span class="label">Beat the boss:</span>
            <span class="value">{{ games }}</span>
        </div>
        <div class="profile-card">
            <span class="label">Best result:</span>
            <span class="value">{{ best }}</span>
        </div>
    </main>

</body>
</html>
